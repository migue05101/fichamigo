<body>
<title>Fichamigo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: app móvil de una columna (máx 520px). Arriba el aparato tipo huevo con pantalla LCD pixelada; debajo pestañas de Deberes / Tienda / Metas / Registro. El modo padre usa el mismo ancho con tarjetas por hijo. */
:root{
  --bg:#E6EEF2; --surface:#FFFFFF; --surface2:#D9E3EA; --ink:#1B1F3B; --muted:#5A6482; --line:#C9D4DE;
  --accent:#5B3FD9; --accent-ink:#FFFFFF; --coin:#F2B01E; --coin-hi:#FFE07A; --coin-ink:#4A3300;
  --ok:#14866A; --ok-bg:#D5F2E8; --warn:#B7600C; --warn-bg:#FCE9D3; --bad:#C8344A; --bad-bg:#F9DCE1;
  --c-escuela:#2F6FE4; --c-casa:#D9480F; --c-deber:#8B3FD9;
  --lcd-frame:#2A2F45;
  --font-pixel:"Silkscreen", "Courier New", monospace;
  --font-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1222; --surface:#181D33; --surface2:#232A45; --ink:#EEF0FA; --muted:#9BA3C2; --line:#2E3657;
  --accent:#9D88FF; --accent-ink:#0E1222; --coin:#F6BE33; --coin-hi:#FFE38F; --coin-ink:#3A2800;
  --ok:#4FD1A5; --ok-bg:#133A30; --warn:#F2A55A; --warn-bg:#3A2A15; --bad:#FF7C8F; --bad-bg:#3D1C25;
  --c-escuela:#7AA5FF; --c-casa:#FF9563; --c-deber:#C39BFF; --lcd-frame:#05070F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1222; --surface:#181D33; --surface2:#232A45; --ink:#EEF0FA; --muted:#9BA3C2; --line:#2E3657;
  --accent:#9D88FF; --accent-ink:#0E1222; --coin:#F6BE33; --coin-hi:#FFE38F; --coin-ink:#3A2800;
  --ok:#4FD1A5; --ok-bg:#133A30; --warn:#F2A55A; --warn-bg:#3A2A15; --bad:#FF7C8F; --bad-bg:#3D1C25;
  --c-escuela:#7AA5FF; --c-casa:#FF9563; --c-deber:#C39BFF; --lcd-frame:#05070F; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.25rem;font-weight:900}
h3{font-size:1rem;font-weight:800}
.px{font-family:var(--font-pixel);letter-spacing:.02em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
p{margin:0}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-pixel);font-weight:700;font-size:1.15rem}
.hright{display:flex;align-items:center;gap:8px}
.wallet{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-weight:900}
.link{border:0;background:transparent;color:var(--muted);font-weight:700;padding:6px 8px;border-radius:8px;white-space:nowrap}
.link:hover{background:var(--surface2);color:var(--ink)}

.coin{--s:24px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-grid;place-items:center;
  background:radial-gradient(circle at 32% 30%,var(--coin-hi),var(--coin) 62%);color:var(--coin-ink);
  font-family:var(--font-pixel);font-weight:700;font-size:calc(var(--s)*.5);box-shadow:inset 0 0 0 2px rgb(0 0 0 / .14),inset 0 -2px 0 rgb(0 0 0 / .16)}
.coin::after{content:"F"}
.tok{display:inline-flex;align-items:center;gap:5px;font-weight:900;white-space:nowrap}
.tok .coin{--s:18px}

main{display:grid;gap:20px;padding-top:6px}
section{display:grid;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sechead p{color:var(--muted);font-size:.88rem}

/* ---------- Aparato ---------- */
.device{--shell:#7C5CFF;position:relative;margin:4px auto 0;width:100%;max-width:380px;padding:26px 22px 26px;
  border-radius:48% 48% 44% 44% / 40% 40% 34% 34%;
  background:radial-gradient(120% 90% at 30% 15%,color-mix(in srgb,var(--shell) 55%,#fff) 0%,var(--shell) 45%,color-mix(in srgb,var(--shell) 70%,#000) 100%);
  box-shadow:inset 0 -10px 0 rgb(0 0 0 / .14),inset 0 6px 0 rgb(255 255 255 / .25),0 14px 30px -12px rgb(0 0 0 / .45);
  display:grid;gap:10px;justify-items:center}
.dev-top{display:flex;justify-content:space-between;align-items:center;width:84%;color:#fff;text-shadow:0 1px 0 rgb(0 0 0 / .35)}
.dev-top .pname{font-family:var(--font-pixel);font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.dev-top .stage{font-family:var(--font-pixel);font-size:.78rem;background:rgb(0 0 0 / .25);padding:2px 8px;border-radius:6px;white-space:nowrap}
.screen{width:86%;background:var(--lcd-frame);padding:8px;border-radius:14px;box-shadow:inset 0 3px 0 rgb(0 0 0 / .4)}
.screen canvas{display:block;width:100%;height:auto;aspect-ratio:16/15;border-radius:6px;max-width:100%}
.stats{width:86%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;gap:3px;color:#fff;font-family:var(--font-pixel);font-size:.66rem;text-shadow:0 1px 0 rgb(0 0 0 / .35)}
.stat .bar{height:8px;border-radius:2px;background:rgb(0 0 0 / .3);overflow:hidden}
.stat .bar i{display:block;height:100%;background:#7CFFB2}
.stat.low .bar i{background:#FF6B81}
.stat.mid .bar i{background:#FFD45C}
.status{width:86%;text-align:center;color:#fff;font-weight:800;font-size:.9rem;text-shadow:0 1px 0 rgb(0 0 0 / .4);min-height:1.3em}
.btns{display:flex;gap:16px;justify-content:center;margin-top:2px}
.rb{display:grid;justify-items:center;gap:4px;border:0;background:transparent;color:#fff;font-family:var(--font-pixel);font-size:.72rem;text-shadow:0 1px 0 rgb(0 0 0 / .4)}
.rb span.k{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#F2F2F7 30%,#BFC3D6 100%);
  box-shadow:0 4px 0 rgb(0 0 0 / .3),inset 0 -3px 0 rgb(0 0 0 / .12);display:grid;place-items:center;font-size:1.3rem;color:#33395A;text-shadow:none;transition:transform .08s}
.rb:active span.k{transform:translateY(3px);box-shadow:0 1px 0 rgb(0 0 0 / .3)}
.rb:disabled{opacity:.45;cursor:not-allowed}
.drawer{width:92%;background:rgb(255 255 255 / .94);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;color:#1B1F3B}
.food{border:1px solid #D7DBEA;background:#fff;border-radius:10px;padding:6px;display:grid;justify-items:center;gap:2px;font-size:.8rem;font-weight:800;color:#1B1F3B}
.food canvas{width:36px;height:36px}
.food:disabled{opacity:.4}
.food small{color:#5A6482;font-weight:700}

/* ---------- Pestañas, listas ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:800;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;display:inline-grid;place-items:center;font-weight:900}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.item .body{min-width:0;display:grid;gap:3px}
.item .t{font-weight:800;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted);align-items:center}
.cat{width:8px;align-self:stretch;border-radius:4px;background:var(--line)}
.cat.escuela{background:var(--c-escuela)} .cat.casa{background:var(--c-casa)} .cat.deber{background:var(--c-deber)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:800}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.plain{background:var(--surface2);color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted)}
.amt{font-weight:900;white-space:nowrap}
.amt.pos{color:var(--ok)} .amt.neg{color:var(--bad)}

.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:900;background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 11px;font-size:.86rem;border-radius:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.okb{background:var(--ok);color:#fff}
.btn.coinb{background:var(--coin);color:var(--coin-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px;font-weight:800}
.x:hover{background:var(--surface2);color:var(--bad)}

.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start}
.prod canvas{width:100%;height:auto;border-radius:8px;background:#CFE8F2}
.prod .stkimg{width:100%;height:96px;object-fit:contain;background:linear-gradient(#EAF6FB 62%,#F1D7B5 62%);border-radius:8px;padding:6px}
.foodimg{width:40px;height:40px;object-fit:contain}
.prod .t{font-weight:800;font-size:.92rem}
.prod .row2{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.prod.owned{border-color:var(--ok)}

.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.goal .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pbar{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coin),var(--coin-hi))}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:800;color:var(--muted);min-width:0}
input,select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:.82rem;color:var(--muted);font-weight:700}
.chip:hover{border-style:solid;color:var(--ink)}
.pnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.toggle input{width:auto;margin-top:4px}

.welcome{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:6px}
.welcome h1{font-family:var(--font-pixel);font-size:2rem}
.welcome .lead{max-width:34ch;color:var(--muted);font-size:1.02rem}
.choices{display:grid;gap:10px;width:100%;max-width:360px}
.pinbox{display:grid;gap:12px;width:100%;max-width:320px}
.pinbox input{text-align:center;font-size:1.6rem;letter-spacing:.45em;font-family:var(--font-pixel)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%}
.whob{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:grid;justify-items:center;gap:6px;font-weight:900}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}

.kidcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:120px 1fr;gap:12px}
.kidcard canvas{width:120px;height:112px;border-radius:10px;border:4px solid var(--kc,#7C5CFF)}
.kidcard .info{min-width:0;display:grid;gap:6px;align-content:start}
.mini{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.78rem;align-items:center}
.mini .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--ok)}
.mini .bar.low i{background:var(--bad)} .mini .bar.mid i{background:var(--coin)}
.kidcard .foot{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--font-pixel);background:var(--surface2);padding:2px 8px;border-radius:6px}
.species{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;width:100%}
.spb{border:3px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px;display:grid;justify-items:center;gap:4px;font-weight:900}
.spb canvas{width:100%;height:auto;border-radius:8px;max-width:100%}
.spb img{width:100%;max-width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 2px 2px rgb(0 0 0 / .12))}
.spb{font-size:.78rem;line-height:1.15;text-align:center;padding:6px}
.spb[aria-pressed="true"]{border-color:var(--accent)}
.notice{margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.88rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:800;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (max-width:420px){.kidcard{grid-template-columns:1fr}.kidcard canvas{width:100%;height:auto}.rb span.k{width:44px;height:44px}.item{grid-template-columns:auto 1fr}.item .actions{grid-column:1/-1;justify-content:flex-start}}

/* ---------- modo juego a pantalla completa ---------- */
body.playing{overflow:hidden}
.play{--shell:#7C5CFF;position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:10px;color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 25% 0%,color-mix(in srgb,var(--shell) 60%,#fff) 0%,var(--shell) 40%,color-mix(in srgb,var(--shell) 55%,#000) 100%)}
.play>*{width:100%;max-width:760px;margin-inline:auto}
.ptop{display:flex;align-items:center;gap:8px}
.pid{flex:1;min-width:0;display:grid;line-height:1.15;text-shadow:0 1px 0 rgb(0 0 0 / .35)}
.pid .pname{font-family:var(--font-pixel);font-weight:700;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pid .stage{font-family:var(--font-pixel);font-size:.72rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip{display:inline-flex;align-items:center;gap:6px;background:rgb(0 0 0 / .25);border-radius:999px;padding:4px 12px 4px 4px;font-weight:900;font-size:1.05rem}
.iconbtn{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:rgb(0 0 0 / .22);color:#fff;font-size:1.15rem;font-weight:900;display:grid;place-items:center}
.iconbtn:hover{background:rgb(0 0 0 / .32)}
.lcdwrap{flex:1;min-height:0;background:var(--lcd-frame);border-radius:22px;padding:8px;display:flex;box-shadow:inset 0 3px 0 rgb(0 0 0 / .4),0 10px 24px -12px rgb(0 0 0 / .5)}
.lcdwrap canvas{display:block;width:100%;height:100%;object-fit:contain;border-radius:12px}
.play .stats,.play .status{width:100%}
.play .stat{font-size:.72rem}
.play .stat .bar{height:10px}
.play .btns{gap:clamp(10px,4vw,26px)}
.play .drawer{width:100%;max-width:760px;display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding:8px;-webkit-overflow-scrolling:touch}
.play .drawer .food{flex:0 0 96px;scroll-snap-align:start;text-align:center;line-height:1.1}
.rb .k{position:relative}
.rb .dot{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-style:normal;font-size:.72rem;font-family:var(--font-body);font-weight:900;display:grid;place-items:center}
.paircard{background:rgb(0 0 0 / .25);border-radius:14px;padding:8px 12px;display:grid;justify-items:center;text-align:center;gap:2px}
.paircard b{font-size:1.6rem;letter-spacing:.15em}
.paircard small{opacity:.85}
.sheet .paircard{background:var(--surface2);color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:40;background:rgb(10 12 25 / .45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgb(0 0 0 / .3);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheethead{display:flex;gap:8px;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheethead .tabs{flex:1;min-width:0}
.closeb{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:900;font-size:1rem}
.sheetbody{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start}
.sheetbody>*{width:100%;max-width:720px;margin-inline:auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-height:640px){.play{gap:6px}.rb span.k{width:42px;height:42px}.play .status{font-size:.82rem}}
.lcdwrap{position:relative}
.lcdwrap canvas{touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.hint{font-size:.74rem;text-align:center;opacity:.85;text-shadow:0 1px 0 rgb(0 0 0 / .35)}
.petmenu{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(340px,calc(100% - 24px));max-height:calc(100% - 28px);overflow:auto;
  background:rgb(255 255 255 / .97);color:#1B1F3B;border-radius:16px;padding:12px;display:grid;gap:10px;box-shadow:0 10px 30px rgb(0 0 0 / .35);border:3px solid #23253A}
.petmenu p{font-size:.85rem;color:#5A6482}
.pmhead{display:flex;align-items:center;gap:8px}

function calc(p,now=Date.now()){
  if(!p)return null;
  if(!p.hatchedAt)return {egg:true,h:100,hp:100,c:100,dead:false};
  const at=p.at||now, hrs=Math.max(0,(now-at)/HR);
  const h=Math.max(0,(p.hunger??80)-hrs*100/HUNGER_H), hp=Math.max(0,(p.happy??80)-hrs*100/HAPPY_H), c=Math.max(0,(p.clean??100)-hrs*100/CLEAN_H);
  const zeroAt=at+((p.hunger??80)/100*HUNGER_H)*HR;
  const dead=h<=0&&now-zeroAt>DEATH_H*HR;
  const left=h>0?h/100*HUNGER_H:Math.max(0,DEATH_H-(now-zeroAt)/HR);
  return {egg:false,h,hp,c,dead,left};
}

}

  if(id==="bloques")blqInit();if(id==="frutas")frtInit();if(id==="memoria")memInit();if(id==="topos")topInit();if(id==="simon")simInit();
  tune([[523,.06],[659,.06],[784,.1]]);render();
  if(MINIS[id].dur)mgI(()=>{if(!MG||MG.phase!=="play")return;const left=Math.max(0,MINIS[MG.id].dur-(performance.now()-MG.t0)/1000);const e=document.getElementById("mgtime");if(e)e.textContent=Math.ceil(left)+" s";if(left<=0)endMini()},200);

function mgScore(n){MG.score=n;const e=document.getElementById("mgscore");if(e)e.textContent=n}
function endMini(){if(!MG||MG.phase!=="play")return;MG.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});MG.timers=[];
  const def=MINIS[MG.id],reward=MREW[MG.id](MG.score),win=MG.score>=def.goal;MG.phase="done";MG.reward=reward;MG.win=win;
  G.coins+=reward;gHud();if(MG.ctx.crit&&win)G.friends.add(MG.ctx.crit.id);if(MG.ctx.npc)G.npcPlayed.add(MG.ctx.npc.n);
  if(win)tune([[523,.07],[659,.07],[784,.07],[1046,.22]]);else tune([[523,.08],[440,.08],[392,.14]]);render()}
function closeMini(){if(!MG)return;MG.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});const ctx=MG.ctx;MG=null;if(ctx.crit&&G)G.enc=null;render()}
function quitMini(){if(!MG)return;if(MG.phase==="play")endMini();else closeMini()}
/* --- Bloques (tipo Tetris) --- */
const PZ={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]]};
const PZC={I:"#4CC9F0",O:"#FFD60A",T:"#9D4EDD",L:"#FF9F1C",J:"#3A86FF",S:"#43C478",Z:"#FF4D6D"};
const BW=8,BH=14;
function blqInit(){MG.grid=Array.from({length:BH},()=>Array(BW).fill(null));MG.lines=0;MG.drop=650;MG.last=performance.now();MG.next=blqRand();blqSpawn()}
function blqRand(){const k="IOTLJSZ"[Math.floor(Math.random()*7)];return k}
function blqSpawn(){const k=MG.next;MG.next=blqRand();MG.p={k,c:PZ[k].map(a=>[...a]),x:2,y:0};if(blqHit(MG.p.c,MG.p.x,MG.p.y))endMini()}
function blqHit(c,x,y){return c.some(([a,b])=>{const X=a+x,Y=b+y;return X<0||X>=BW||Y>=BH||(Y>=0&&MG.grid[Y][X])})}
function blqMove(dx){if(!MG||MG.phase!=="play"||!MG.p)return;if(!blqHit(MG.p.c,MG.p.x+dx,MG.p.y)){MG.p.x+=dx;beep(520,.02)}}
function blqRot(){const p=MG&&MG.p;if(!p||MG.phase!=="play"||p.k==="O")return;const n=p.k==="I"?p.c.map(([x,y])=>[3-y,x]):p.c.map(([x,y])=>[2-y,x]);
  for(const k of [0,-1,1,-2,2])if(!blqHit(n,p.x+k,p.y)){p.c=n;p.x+=k;beep(700,.03);return}}
function blqDown(){const p=MG.p;if(!blqHit(p.c,p.x,p.y+1)){p.y++;return true}
  p.c.forEach(([a,b])=>{if(b+p.y>=0)MG.grid[b+p.y][a+p.x]=p.k});let cl=0;
  for(let y=BH-1;y>=0;y--)if(MG.grid[y].every(Boolean)){MG.grid.splice(y,1);MG.grid.unshift(Array(BW).fill(null));cl++;y++}
  if(cl){MG.lines+=cl;mgScore(MG.lines);tune(cl>1?[[784,.06],[988,.06],[1318,.12]]:[[784,.06],[1046,.1]]);MG.drop=Math.max(260,MG.drop-40)}else beep(260,.04);
  blqSpawn();return false}
function blqDrop(){if(!MG||MG.phase!=="play")return;while(blqDown()){}}
function drawBloques(c,ts){const W=BW*10,H=BH*10;R(c,0,0,W,H,"#1E2140");for(let y=0;y<BH;y++)for(let x=0;x<BW;x++)R(c,x*10+4,y*10+4,2,2,"#2C3160");
  const cell=(x,y,k,ghost)=>{const col=PZC[k];if(ghost){R(c,x*10,y*10,10,1,col);R(c,x*10,y*10+9,10,1,col);R(c,x*10,y*10,1,10,col);R(c,x*10+9,y*10,1,10,col);return}
    R(c,x*10,y*10,10,10,mix(col,"#000000",.35));R(c,x*10,y*10,9,9,col);R(c,x*10+1,y*10+1,7,2,mix(col,"#FFFFFF",.45));R(c,x*10+1,y*10+1,2,6,mix(col,"#FFFFFF",.3))};
  MG.grid.forEach((row,y)=>row.forEach((k,x)=>k&&cell(x,y,k)));
  if(MG.p){let gy=MG.p.y;while(!blqHit(MG.p.c,MG.p.x,gy+1))gy++;MG.p.c.forEach(([a,b])=>cell(a+MG.p.x,b+gy,MG.p.k,true));MG.p.c.forEach(([a,b])=>b+MG.p.y>=0&&cell(a+MG.p.x,b+MG.p.y,MG.p.k))}}
/* --- Atrapa frutas --- */
const FW=96,FH=128;
function frtInit(){MG.bx=48;MG.items=[];MG.lastSpawn=0;MG.hold=0;MG.shake=0}
function drawFrutas(c,ts){const el=(ts-MG.t0)/1000;
  for(let y=0;y<FH;y++)R(c,0,y,FW,1,mix("#8FD3FF","#E9F8FF",y/FH));oval(c,20,20,8,3,"#FFFFFF");oval(c,74,30,10,3,"#FFFFFF");R(c,0,118,FW,10,"#7ED38A");R(c,0,118,FW,1,"#5DBB6E");
  if(ts-MG.lastSpawn>Math.max(320,650-el*12)){MG.lastSpawn=ts;const r=Math.random();MG.items.push({x:6+Math.random()*(FW-14),y:-8,v:.9+Math.random()*.6+el*.03,k:r<.18?"rock":r<.27?"star":["fruta","galleta","pizza","arepa"][Math.floor(Math.random()*4)]})}
  if(MG.hold)MG.bx=Math.max(10,Math.min(FW-10,MG.bx+MG.hold*2.6));
  MG.items.forEach(it=>{it.y+=it.v*2.2});
  MG.items=MG.items.filter(it=>{if(it.y>104&&it.y<116&&Math.abs(it.x+3-MG.bx)<12){if(it.k==="rock"){mgScore(Math.max(0,MG.score-2));MG.shake=ts;tune([[200,.1],[150,.12]])}else{const v=it.k==="star"?3:1;mgScore(MG.score+v);beep(it.k==="star"?1318:988,.05)}return false}return it.y<FH});
  MG.items.forEach(it=>{if(it.k==="rock"){oval(c,it.x+3,it.y+3,4,3,"#9AA5B1",OL);R(c,it.x+1,it.y+1,2,1,"#C9D1DA")}else if(it.k==="star")spark(c,it.x+3,it.y+3,"#FFD60A"),spark(c,it.x+3,it.y+3,"#FFD60A"),R(c,it.x+1,it.y+1,5,5,"#FFD60A"),R(c,it.x+2,it.y+2,1,1,"#FFFFFF");else drawFood(c,it.k,it.x,it.y)});
  const sx=MG.shake&&ts-MG.shake<250?(Math.floor(ts/40)%2?1:-1):0,bx=Math.round(MG.bx)+sx;
  R(c,bx-12,108,24,2,OL);R(c,bx-11,110,22,7,OL);R(c,bx-10,110,20,6,"#D29A65");for(let i=-9;i<10;i+=4)R(c,bx+i,110,1,6,"#A86F3E");R(c,bx-12,108,24,1,"#E6B07A")}
/* --- Memoria --- */
function memInit(){const ids=CRIT.map(c=>c.id).sort(()=>Math.random()-.5).slice(0,6);MG.cards=[...ids,...ids].sort(()=>Math.random()-.5);MG.open=[];MG.done=new Set();MG.lock=false}
function memFlip(i){if(!MG||MG.phase!=="play"||MG.lock||MG.open.includes(i)||MG.done.has(i))return;MG.open.push(i);beep(700,.03);
  if(MG.open.length===2){const [a,b]=MG.open;if(MG.cards[a]===MG.cards[b]){MG.done.add(a);MG.done.add(b);MG.open=[];mgScore(MG.score+1);tune([[784,.05],[1046,.08]]);if(MG.done.size===MG.cards.length)mgT(endMini,500)}
    else{MG.lock=true;mgT(()=>{if(!MG)return;MG.open=[];MG.lock=false;render()},750)}}render()}
/* --- Topos --- */
function topInit(){MG.up=null;MG.hits=0;mgI(()=>{if(!MG||MG.phase!=="play")return;const el=(performance.now()-MG.t0)/1000;
  let i;do{i=Math.floor(Math.random()*9)}while(MG.up&&MG.up.i===i);const gold=Math.random()<.15,cid=gold?"estrellin":CRIT[Math.floor(Math.random()*5)].id;
  MG.up={i,gold,cid,until:performance.now()+Math.max(480,900-el*20)};mgPaintHoles()},620)}
function mgPaintHoles(){if(!MG||MG.id!=="topos")return;document.querySelectorAll(".hole").forEach((h,i)=>{const on=MG.up&&MG.up.i===i&&performance.now()<MG.up.until;h.classList.toggle("up",!!on);
  const cv=h.querySelector("canvas");if(on&&cv.dataset.c!==MG.up.cid){const c=cv.getContext("2d");c.setTransform(cv.width/64,0,0,cv.width/64,0,0);c.clearRect(0,0,64,48);if(drawCritter(c,MG.up.cid,32,32,1000,40))cv.dataset.c=MG.up.cid}})}
function topHit(i){if(!MG||MG.phase!=="play")return;const u=MG.up;if(u&&u.i===i&&performance.now()<u.until){mgScore(MG.score+(u.gold?3:1));tune(u.gold?[[988,.04],[1318,.08]]:[[880,.05]]);
  const h=document.querySelectorAll(".hole")[i];h.classList.add("hit");setTimeout(()=>h.classList.remove("hit"),250);MG.up=null;mgPaintHoles()}else beep(180,.05)}
/* --- Sigue el ritmo (Simón) --- */
const SIMT=[330,392,494,587];
function simInit(){MG.seq=[Math.floor(Math.random()*4)];MG.pos=0;MG.showing=true}
function simLight(i,ms){const el=document.querySelector(`.pad[data-pad="${i}"]`);if(el){el.classList.add("lit");setTimeout(()=>el.classList.remove("lit"),ms)}beep(SIMT[i],ms/1000)}
function simPlay(){if(!MG||MG.phase!=="play")return;MG.showing=true;MG.pos=0;const st=document.getElementById("simst");if(st)st.textContent="Mira…";
  MG.seq.forEach((v,k)=>mgT(()=>simLight(v,380),k*560));mgT(()=>{if(!MG)return;MG.showing=false;const st=document.getElementById("simst");if(st)st.textContent="¡Tu turno!"},MG.seq.length*560)}
function simPress(i){if(!MG||MG.phase!=="play"||MG.showing)return;simLight(i,220);

  if(MG.pos===MG.seq.length){mgScore(MG.seq.length);if(MG.seq.length>=10){mgT(endMini,400);return}MG.seq.push(Math.floor(Math.random()*4));mgT(simPlay,800)}}

let mgLast=0;
function mgLoop(ts){if(!MG||MG.phase!=="play"||!(MG.id==="bloques"||MG.id==="frutas"))return;requestAnimationFrame(mgLoop);if(ts-mgLast<33)return;mgLast=ts;
  const cv=document.getElementById("mgc");if(!cv)return;const c=cv.getContext("2d");
  if(MG.id==="bloques"){if(ts-MG.last>(MG.soft?60:MG.drop)){MG.last=ts;blqDown()}if(MG&&MG.phase==="play")drawBloques(c,ts)}else drawFrutas(c,ts)}
function miniScreen(){

  if(MG.id==="memoria")body=`<div class="memgrid">${MG.cards.map((id,i)=>{const up=MG.open.includes(i)||MG.done.has(i);return `<button class="mcard ${up?"up":""} ${MG.done.has(i)?"ok":""}" data-mem="${i}" aria-label="Carta ${i+1}">${up?`<canvas width="192" height="144" data-paint="crit:${id}:1"></canvas>`:`<span>?</span>`}</button>`}).join("")}</div>`;
  if(MG.id==="topos")body=`<div class="holes">${Array.from({length:9},(_,i)=>`<button class="hole" data-hole="${i}" aria-label="Hoyo ${i+1}"><canvas width="192" height="144"></canvas></button>`).join("")}</div>`;

function statusMsg(p,st,xi){

  if(st.h<=0)return `¡${n} no ha comido! Le quedan ${Math.ceil(st.left)} h.`;
  const m=moodOf(st);

    if(k==="furn"){item=FURN.find(x=>x.id===w);price=item.p;label="Mueble: "+item.n;patch=pp=>({owned:[...(pp.owned||[]),w]})}
    if(k==="wall"){item=WALLS.find(x=>x.id===w);price=item.p;label="Pared: "+item.n;patch=pp=>({owned:[...(pp.owned||[]),"wall-"+w],wall:w})}

    if((cur==="m"?m.mon:m.wallet)<cost){toast(cur==="m"?"No te alcanzan las monedas.":"No te alcanzan las fichas.");return}
    tune([[660,.06],[880,.06],[1320,.1]]);await ledger(kid,"compra",-cost,label,null,cur);await petWrite(kid,patch);if(petPatch)await petWrite(id,petPatch);toast("¡Comprado!");return}
  if(a==="settint"){const w=b.dataset.w,own=new Set((S.pets[kidOfPet(id)]||{}).owned||[]);if(w&&!own.has("tint-"+w))return;beep(880);await petWrite(id,()=>({tint:w||null}));return}
  if(a==="avuse"){const it=rigItem(b.dataset.v),mp=S.pets[id];if(!it||!mp)return;if(!rigHas(new Set(mp.aOwned||[]),it))return;beep(880);avShow=null;await petWrite(id,pp=>{const av={...avNorm(pp.avatar)};if(it.sec==="a"&&av[it.fld]===it.id)delete av[it.fld];else av[it.fld]=it.id;return {avatar:av}});return}
  if(a==="avoff"){beep(700);await petWrite(id,pp=>{const av={...avNorm(pp.avatar)};delete av[b.dataset.f||b.dataset.v];return {avatar:av}});return}
  if(a==="avskinset"){beep(880);await petWrite(id,pp=>({avatar:{...(pp.avatar||AV_DEF("nino")),skin:+b.dataset.v}}));return}
  if(a==="avgset"){beep(880);await petWrite(id,pp=>({avatar:{...(pp.avatar||AV_DEF("nino")),g:b.dataset.v}}));return}
  if(a==="equip"){const w=WEAR.find(x=>x.id===b.dataset.w);beep(880);await petWrite(id,p=>{const eq={...(p.equip||{})};if(eq[w.slot]===w.id)delete eq[w.slot];else eq[w.slot]=w.id;return {equip:eq}});return}
  if(a==="setwall"){beep(880);await petWrite(id,()=>({wall:b.dataset.w}));return}
  if(a==="newegg"){const p=S.pets[id];await put("pets",id,{...p,tint:p.tint||null,bornAt:Date.now(),hatchedAt:null,hunger:80,happy:80,clean:100,at:Date.now(),gen:(p.gen||1)+1});toast("Un huevo nuevo te espera.");return}
  if(a==="revive"){await petWrite(id,()=>({hunger:60,happy:50,clean:80,at:Date.now()}));toast("¡Revivió!");return}

  if(a==="done"&&S.tasks[id]&&S.tasks[id].needPhoto){photoTask=id;const inp=document.getElementById("photoin");inp.value="";inp.click();return}

  if(a==="approve"){const t=S.tasks[id];await put("tasks",id,{...t,status:"aprobada",approvedAt:Date.now(),note:""});
    await ledger(t.kidId,"tarea",+t.tokens,t.title,t.cat);
    for(const o of petsOf(t.kidId)){const p=o.p;if(!p.species)continue;if(!p.hatchedAt)await put("pets",o.id,{...p,hatchedAt:Date.now(),hunger:85,happy:90,clean:100,at:Date.now()});else await petWrite(o.id,pp=>({happy:clamp(pp.happy+15)}))}
    if(t.repeat&&t.repeat!=="none"){const base=t.due&&t.due>=today()?t.due:today();await put("tasks",uid(),{...t,status:"pendiente",note:"",doneAt:null,approvedAt:null,createdAt:Date.now(),due:addDays(base,t.repeat==="daily"?1:7)})}
    toast(`+${t.tokens} fichas para ${S.kids[t.kidId]?.name||"el joven"}`);return}
  if(a==="reject"){await put("tasks",id,{...S.tasks[id],status:"pendiente",proof:null,note:"Devuelto: revísalo"});return}
  if(a==="deltask"){await del("tasks",id);return}
  if(a==="claim"){tune([[523,.08],[659,.08],[784,.08],[1046,.15]]);await put("goals",id,{...S.goals[id],status:"solicitada",claimedAt:Date.now()});toast("¡Meta reclamada! Tu papá o mamá la entregará.");return}
  if(a==="goalok"){const g=S.goals[id];await put("goals",id,{...g,status:"entregada",deliveredAt:Date.now()});await ledger(g.kidId,"meta",-g.cost,"Meta: "+g.title);toast("Meta entregada");return}
  if(a==="goalno"){await put("goals",id,{...S.goals[id],status:"activa"});return}

  if(a==="delkid"){if(b.dataset.confirm){if(devKid===id)setDevKid(null);for(const o of petsOf(id).reverse())await del("pets",o.id);await del("kids",id);return}b.dataset.confirm="1";b.textContent="¿Seguro? Toca otra vez";b.style.color="var(--bad)";
    setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.textContent="Quitar";b.style.color=""}},3500);return}
  }catch(err){}
});
document.addEventListener("change",e=>{if(e.target.id==="photoin"&&e.target.files&&e.target.files[0])sendProof(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(menuOpen||foodOpen||petMenu)){menuOpen=false;foodOpen=false;petMenu=null;render()}});
document.addEventListener("change",e=>{if(e.target.id==="regkid"){regKid=e.target.value;render()}});
document.addEventListener("change",async e=>{const id=e.target.dataset&&e.target.dataset.maxpets;if(!id||!S.kids[id])return;await put("kids",id,{...S.kids[id],maxPets:e.target.value});toast("Guardado")});
document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  const k=f.dataset.form,v=id=>document.getElementById(id).value.trim();
  try{
  if(k==="toparent"){const p=v("tp-pin");if(!S.config.pin){toast("Primero hay que crear el PIN de padre.");return}
    if(p!==S.config.pin){toast("PIN incorrecto");document.getElementById("tp-pin").value="";beep(180,.2);return}
    role={r:"parent",fromKid:role&&role.r==="kid"?role.id:null};saveRole();wstep=null;menuOpen=false;foodOpen=false;pview=null;ptab="familia";tune([[660,.06],[990,.1]]);window.scrollTo(0,0);render();return}
  if(k==="ppin"){const p=v("pin");if(!/^\d{4}$/.test(p)){toast("El PIN debe tener 4 dígitos.");return}
    if(!S.config.pin){await setConfig({pin:p});toast("PIN creado")}else if(p!==S.config.pin){toast("PIN incorrecto");document.getElementById("pin").value="";beep(180,.2);return}
    role={r:"parent"};saveRole();wstep=null;tune([[660,.06],[990,.1]]);render();return}
  if(k==="chatsend"){const inp=document.getElementById("chat-in"),text=inp.value.trim();if(!text)return;inp.value="";
    try{const j=await api("chat",{family,kidId:f.dataset.kid,with:f.dataset.with,as:f.dataset.as,text});chatMsgs.push(j.msg);beep(880,.04);if(j.flagged)toast("Por seguridad se ocultaron datos personales o palabras feas.");if(qchat){renderQChat();document.getElementById("chat-in")?.focus();return}render();const l=document.getElementById("chatlog");if(l)l.scrollTop=l.scrollHeight;document.getElementById("chat-in")?.focus()}
    catch(e){inp.value=text;toast(e.code==="notfriends"?"Todavía no son amigos aprobados.":e.code==="chatoff"?"Tus papás desactivaron el chat.":"No se pudo enviar.")}return}
  if(k==="addfriend"){const kid=f.dataset.kid;try{const j=await api("friend/request",{family,kidId:kid,code:v("af-code")});document.getElementById("af-code").value="";toast(j.st==="ok"?`${j.nick} ya es tu amigo`:`Solicitud enviada a ${j.nick}. Faltan los permisos de los papás.`);await loadFriends(kid);render()}
    catch(e){toast(e.code==="nocode"?"No encontramos ese código.":e.code==="samefamily"?"Ese código es de alguien de tu misma familia.":"No se pudo enviar.")}return}
  if(k==="ksocial"){const kid=f.dataset.kid;await put("kids",kid,{...S.kids[kid],nick:v("ks-nick-"+kid).slice(0,16),social:{world:document.getElementById("ks-world-"+kid).checked,chat:document.getElementById("ks-chat-"+kid).checked}});
    await syncProfile(kid,true);toast("Guardado");return}
  if(k==="consent"){if(!document.getElementById("consent2").checked)return;await setConfig({consent:{at:Date.now(),v:1}});toast("¡Gracias!");return}
  if(k==="delfamily"){if(v("del-word").trim().toUpperCase()!=="BORRAR"){toast("Escribe BORRAR para confirmar.");return}
    try{await api("family/delete",{family,pin:v("del-pin")});try{localStorage.clear()}catch(e){}toast("Tu familia y todos sus datos fueron borrados.");setTimeout(()=>location.reload(),1500)}
    catch(e){toast(e.code==="pin"?"El PIN no coincide.":"No se pudo borrar. Revisa tu internet.")}return}
  if(k==="tcreate"){if(!document.getElementById("tc-ok").checked){toast("Debes aceptar los términos.");return}const pin=v("tc-pin");if(!/^\d{4}$/.test(pin)){toast("El PIN debe tener 4 dígitos.");return}
    try{const j=await api("teacher",{name:v("tc-name"),pin});role={r:"teacher",id:j.teacher,name:j.name};saveRole();wstep=null;tTab="grupos";TS_=null;tune([[660,.06],[990,.1]]);toast("¡Perfil de docente creado!");render();tLoad()}catch(e){toast("No se pudo crear. Revisa tu internet.")}return}
  if(k==="tjoin"){try{const j=await api("teacher/join",{teacher:v("tj-code").toLowerCase().replace(/\s/g,""),pin:v("tj-pin")});role={r:"teacher",id:j.teacher,name:j.name};saveRole();wstep=null;tTab="grupos";TS_=null;render();tLoad();toast("Conectado")}
    catch(e){toast(e.code==="pin"?"PIN incorrecto.":e.code==="notfound"?"No encontramos ese código de docente.":"No se pudo conectar.")}return}
  if(k==="tgroup"){await tApi("teacher/group",{name:v("tg-name")},"Grupo creado");return}
  if(k==="tstudent"){const g=f.dataset.g,inp=document.getElementById("ts-code-"+g);try{const j=await tApi("teacher/student",{gid:g,code:inp.value.trim()});inp.value="";toast(j.status==="ok"?`${j.name} ya está en el grupo`:`Solicitud enviada a los padres de ${j.name}`)}catch(e){}return}
  if(k==="tassign"){try{const j=await tApi("teacher/assign",{gid:v("ta-g"),title:v("ta-title"),desc:document.getElementById("ta-desc").value,tokens:v("ta-tok"),due:v("ta-due"),needPhoto:document.getElementById("ta-photo").checked});
    document.getElementById("ta-title").value="";document.getElementById("ta-desc").value="";toast(j.sent?`Tarea enviada a ${j.sent} estudiante${j.sent===1?"":"s"}`:"Tarea creada. Llegará a cada estudiante cuando sus padres aprueben la vinculación.")}catch(e){}return}
  if(k==="erate"){await setConfig({eRate:+v("s-erate")});toast("Guardado");return}
  if(k==="fcreate"){const p=v("pin");if(!/^\d{4}$/.test(p)){toast("El PIN debe tener 4 dígitos.");return}
    if(!document.getElementById("consent").checked){toast("Para crear la familia necesitamos tu autorización.");return}
    try{const j=await api("family",{pin:p,consent:true});setFamily(j.family);applyState(j.state);role={r:"parent"};saveRole();wstep=null;ptab="familia";tune([[660,.06],[990,.1]]);toast("¡Familia creada!");render()}catch(e){toast("No se pudo crear. Revisa tu internet.")}return}
  if(k==="fjoin"){try{const j=await api("join",{family:v("fj-code").toLowerCase().replace(/\s/g,""),pin:v("fj-pin")});setFamily(j.family);applyState(j.state);role={r:"parent"};saveRole();wstep=null;ptab="familia";tune([[660,.06],[990,.1]]);toast("Celular conectado a tu familia");render()}

      tune([[523,.06],[659,.06],[784,.06],[1046,.12]]);toast(`¡Hola de nuevo, ${S.kids[j.kidId]?S.kids[j.kidId].name:""}!`);render();if(typeof subscribePush==="function"&&"Notification" in window&&Notification.permission==="granted")subscribePush().catch(()=>{})}
    catch(e){toast(e.code==="locked"?"Demasiados intentos. Espera 15 minutos.":e.code==="pin"?"El PIN no coincide.":e.code==="nocode"?"No encontramos ese código. Revísalo en Zona de padres → Familia.":"No se pudo abrir. Revisa tu internet.")}return}
  if(k==="recover"){if(v("rc-pin")!==S.config.pin){toast("PIN incorrecto");document.getElementById("rc-pin").value="";beep(180,.2);return}
    role={r:"kid",id:wkid};setDevKid(wkid);saveRole();wstep=null;menuOpen=false;ktab="deberes";tune([[523,.06],[784,.1]]);render();return}
  if(k==="species"){const id=f.dataset.id,kid=f.dataset.kid||id;if(!pickSp)return;

    adoptFor=null;pickSp=null;tune([[392,.08],[523,.08],[659,.08],[784,.14]]);return}
